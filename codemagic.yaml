workflows:
ios-simulator:
name: iOS Simulator Build

```
environment:
  flutter: stable
  xcode: latest

scripts:
  - flutter pub get
  - flutter clean
  - flutter build ios --simulator

  - |
    cd build/ios/iphonesimulator
    zip -r Runner.app.zip Runner.app

artifacts:
  - build/ios/iphonesimulator/Runner.app.zip
```
