workflows:
ios_simulator:
name: iOS Simulator Build

```
instance_type: mac_mini_m2

environment:
  flutter: stable

scripts:
  - flutter pub get
  - flutter clean
  - flutter build ios --simulator

  - name: Create Appetize ZIP
    script: |
      cd build/ios/iphonesimulator
      zip -r Runner.app.zip Runner.app

artifacts:
  - build/ios/iphonesimulator/Runner.app.zip
```
